### Nav2 stack configuration for the AMR.
# Frames match amr_slam / amr_bringup: map -> odom -> base_footprint.
# Velocity limits kept conservative (indoor PCB-manufacturing floor with
# pedestrians nearby, per ISO 3691-4) - tune up only after validating
# e-stop / safety-rated field behavior.

amcl:
  ros__parameters:
    use_sim_time: false
    # The robot is always physically placed at the same spot slam_toolbox
    # was started from (map frame (0,0,0) is, by definition, wherever the
    # robot was when mapping began - see the mapping-origin discussion
    # this was set from) before every navigation run, so that's a valid
    # fixed initial pose - amcl no longer starts from its own default
    # (wide, unconverged) particle spread and needs no manual "2D Pose
    # Estimate"/"ตั้งตำแหน่งเริ่มต้น" tap. If that physical starting spot
    # ever changes, this must be updated to match, or amcl will converge
    # confidently on the WRONG pose instead of the right one.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # Odometry noise model. Yaw comes from the gyro (EKF), so rotation is
    # trusted more; wheels slip now and then on straights (start-up and
    # cruising), so translation is trusted less and the scans pull the pose
    # back sooner. (were all 0.2)
    alpha1: 0.1   # rotation noise from rotation
    alpha2: 0.2   # rotation noise from translation
    alpha3: 0.4   # translation noise from translation
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 25.0   # was 16 - 30x50 m hall: room center is 15 m from the side walls
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120
    # Lowered from 2000/500 to reduce amcl's CPU cost (it was the single
    # highest-CPU node on this Jetson - 51.7% in a `top` snapshot taken
    # while load average sat at 10+ on this 6-core board, well past
    # capacity - see the CPU-overload discussion this was tuned from).
    # amcl's own cost scales roughly with particle_count * max_beams, so
    # this cut is a rough 2x reduction on the worst case (max_particles-
    # bound). Structured indoor environment + now-fused IMU heading (see
    # amr_bringup/config/ekf.yaml) should still converge reliably at this
    # count, but this needs to be validated on the real robot, not
    # assumed - watch for slower/less robust re-localization (e.g. after
    # the "kidnapped robot" case, or in the long straight/featureless
    # corridors called out elsewhere in this file) and raise these back
    # up if convergence becomes unreliable.
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 2   # was 1 - keep particle diversity; less collapse from one bad scan (people walking by)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.15
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05   # was 0.1 - keep updating during slow final approach + in-place yaw correction
    update_min_d: 0.05   # was 0.1 - ~every scan at 0.5 m/s (C3 ~10 Hz); watch CPU (amcl history of 50%+)
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: scan

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Copies of the stock Nav2 BTs with recovery Spin limited to 1.39 rad (~80 deg)
    # instead of 1.57 (90 deg) - see behavior_trees/.
    default_nav_to_pose_bt_xml: "/home/nvidia/AMR_Project/proj_ws/install/amr_navigation/share/amr_navigation/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/home/nvidia/AMR_Project/proj_ws/install/amr_navigation/share/amr_navigation/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    # Default "odom" has no publisher: the controller saw 0 velocity forever, so
    # RPP's in-place turn was stuck at max_angular_accel * dt = 0.015 rad/s
    odom_topic: "/odometry/filtered"
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # In-place turns don't count as progress and take >10 s at this speed
      # (was 0.5 m / 10 s)
      required_movement_radius: 0.25
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Arrive anywhere within 10 cm, any heading: exact pin placement isn't
      # needed and in-place rotation at the goal slips on this floor.
      # (was 0.30 m; 0.15 m / 0.2 rad before)
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 6.28

    # Regulated Pure Pursuit: follows the planner's path at a constant
    # desired_linear_vel on straights (MPPI's sampling made the speed wander).
    # It does not steer around obstacles - it stops and the BT replans.
    # Slows only for tight curves and the goal; slip limit (/speed_limit)
    # still applies. Protective stops stay in collision_monitor.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.30
      lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_interpolation: true
      allow_reversing: false
      # Below ~0.07 m/s the body doesn't follow wheel differential (bag
      # 20261020_155840), so both speed floors stay above that.
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      # off: would slow down whenever the path runs through inflation,
      # i.e. speed changes along corridors
      use_cost_regulated_linear_velocity_scaling: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.50
      # RPP limits w to measured w + accel * dt. Stationary: 0.30 * 0.05 =
      # 0.015 rad/s, too small to start turning, so measured w stays 0 and the
      # turn never starts. High enough to reach full w from rest in one cycle;
      # velocity_smoother (open loop) does the real ramp: max_accel[2].
      max_angular_accel: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Real chassis footprint from amr_description/urdf/amr.urdf.xacro
      # (base_depth=0.951, base_width=0.496, centered on base_link), rounded
      # up ~1.5cm/side to cover the drive wheels poking slightly past the
      # base box on Y. Rectangle corners, base_link frame, X forward/Y left.
      footprint: "[[0.49, 0.38], [0.49, -0.38], [-0.58, -0.38], [-0.58, 0.38]]"
      # stvl_layer is configured below but NOT loaded: inside controller_server
      # it marks nothing (0 voxels, 2026-10-05), while the same params in a
      # standalone costmap work. Until that is fixed, depth only feeds
      # collision_monitor (slow/stop on low obstacles, no re-planning around
      # them). Re-enable: add "stvl_layer" between obstacle_layer and
      # inflation_layer.
      plugins: ["obstacle_layer", "inflation_layer"]
      # HP60C depth (amr_bringup/launch/depth_camera.launch.py), 320x240
      # @ ~8 Hz. Covers what the single LiDAR plane misses: low objects on
      # the floor and overhangs (tables, forklift forks) below robot height.
      # STVL instead of VoxelLayer because the factory floor is mirror-glossy
      # epoxy: the camera gets 0% depth returns off clear floor, so
      # raytrace clearing (which needs a return to trace to) never removes
      # a mark - people walking past would leave ghost obstacles. STVL
      # forgets voxels by time (voxel_decay) and decays faster anything
      # inside the camera frustum that is no longer seen.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.0            # s; 0.2 m/s * 1 s = 20 cm of travel
        decay_model: 0              # linear
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1       # max
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: depth_mark depth_clear
        depth_mark:
          data_type: PointCloud2
          topic: /depth_camera/points
          marking: true
          clearing: false
          obstacle_range: 2.5       # depth noise grows fast past this
          min_obstacle_height: 0.05 # drop floor returns
          max_obstacle_height: 1.8  # above robot top
          # 0 = off. STVL only counts a message as an update if it has valid
          # points, so on the glossy floor an empty-but-healthy camera would
          # warn constantly. Camera liveness needs its own watchdog on the
          # depth image rate instead.
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"           # downsample 76.8k pts/frame on-CPU
          voxel_min_points: 2       # reject single-pixel speckle
          clear_after_reading: true
        depth_clear:
          data_type: PointCloud2
          topic: /depth_camera/points
          marking: false
          clearing: true
          max_z: 2.5
          min_z: 0.1
          vertical_fov_angle: 1.03  # rad, 2*atan(120/212) at 320x240
          horizontal_fov_angle: 1.29 # rad, 2*atan(160/212)
          decay_acceleration: 5.0   # in-view voxels not re-seen vanish fast
          model_type: 0             # depth camera frustum
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: ""
          clear_after_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # LiDAR is a single plane, so a 2D ObstacleLayer is enough. It was a
      # VoxelLayer, but with a VoxelLayer in the same costmap the stvl_layer
      # grid stayed empty (0 voxels) - reproduced 2026-10-05 with the live
      # parameter dump; ObstacleLayer + STVL marks normally.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered   # self-hits removed: amr_bringup/config/laser_filter.yaml
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.49, 0.38], [0.49, -0.38], [-0.58, -0.38], [-0.58, 0.38]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered   # self-hits removed: amr_bringup/config/laser_filter.yaml
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50   # was 1.0 - match RPP rotate_to_heading_angular_vel
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.0   # was 2.0 - reduce slip during Spin recovery

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 0.50]    # angular was 1.0 - match MPPI wz_max
    min_velocity: [-0.30, 0.0, -0.50]
    # Lowered to reduce wheel slip on start/stop (was 1.0/2.0: 0 -> 0.2 m/s
    # in 0.2 s). Decel kept steeper than accel so stopping distance stays
    # short: 0.2 m/s -> 0 in 0.4 s (~4 cm).
    max_accel: [0.15, 0.0, 0.30]
    max_decel: [-0.50, 0.0, -1.00]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FrontStop", "FootprintApproach"]
    # Hard stop zone ahead of the bumper. Needed because the HP60C cannot see
    # closer than ~0.28 m from the lens (~0.27 m ahead of the footprint):
    # FootprintApproach alone only starts slowing at v*1.2 s = 0.24 m @0.2 m/s,
    # i.e. after a depth-only obstacle (below the LiDAR plane) has already
    # vanished into the blind zone - the robot would drive into it. Stopping
    # at 0.35 m keeps the obstacle in view, so the robot stays stopped until
    # it is removed. Braking @0.2 m/s, -0.5 m/s^2 ~4 cm + ~2.5 cm camera
    # latency -> expect a stop ~0.28-0.30 m short of the object.
    # Humble applies every observation source to every polygon, so the
    # LiDAR also triggers this (e.g. walls when docking).
    FrontStop:
      type: "polygon"
      action_type: "stop"
      # x,y pairs in base_footprint: bumper (0.49) .. +0.35 m, width +-0.29
      points: [0.84, 0.41, 0.84, -0.41, 0.49, -0.41, 0.49, 0.41]
      max_points: 5          # Humble: act when MORE than this many points inside
      visualize: True
      polygon_pub_topic: "polygon_front_stop"
      enabled: True
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      max_points: 3          # Humble name (min_points is Iron+ and was ignored)
      visualize: False
      enabled: True
    observation_sources: ["scan", "depth"]
    scan:
      type: "scan"
      topic: "/scan_filtered"   # self-hits removed: amr_bringup/config/laser_filter.yaml
      min_height: 0.05
      max_height: 2.0
      enabled: True
    depth:
      type: "pointcloud"
      topic: "/depth_camera/points"
      min_height: 0.05
      max_height: 1.8
      enabled: True
