# /scan -> /scan_filtered for Nav2 obstacle sources (costmaps + collision_monitor).
#
# The RPLIDAR is mounted facing backwards (lidar_link yaw = 180 deg) and hits
# the robot's own rear frame/posts: ~20 returns land INSIDE the footprint
# (e.g. base_footprint (-0.24, +0.22), (-0.49, -0.25), (-0.14, -0.24);
# measured 2026-10-05). collision_monitor's FootprintApproach then sees a
# "collision" at t=0 and clamps every cmd_vel to 0 - the robot cannot move.
#
# The box is the footprint from nav2_params.yaml (+-0.49 x +-0.26) plus 1 cm,
# so it only removes points that are physically on the robot. SLAM/AMCL keep
# using the raw /scan.
scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: robot_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_footprint
        min_x: -0.88
        max_x: 0.50
        min_y: -0.41
        max_y: 0.41
        min_z: -1.0
        max_z: 2.0
        invert: false        # false = drop points INSIDE the box
    # Cart leg (rear right) of the cart that straddles the robot: measured at
    # base_footprint (-0.70, -0.37) parked, but (-0.72, -0.42) on the U-turn
    # near Station_a (2026-11-24 16:24) - the cart has lateral play, the leg
    # left filter1's box and RPP refused to turn (obstacle 2 cm from the side).
    # Only this patch: x -0.80..-0.62, y -0.47..-0.40 (blind 7 cm beyond the
    # footprint side there, also without a cart). Operator choice (option B).
    filter2:
      name: cart_leg_rear_right
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_footprint
        min_x: -0.80
        max_x: -0.62
        min_y: -0.47
        max_y: -0.40
        min_z: -1.0
        max_z: 2.0
        invert: false
