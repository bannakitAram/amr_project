slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss  # robust to bad scan matches (e.g. from wheel-slip glitches)

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping   #localization

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02  # if 0 never publishes odometry
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 16.0           # matches the simulated 2D lidar range
    minimum_time_interval: 0.2
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000     # program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    # ---- "submapping": slam_toolbox (Karto-based) doesn't expose an
    # explicit submap object like Cartographer, but scan_buffer_size /
    # scan_buffer_maximum_scan_distance define its equivalent - a rolling
    # local window of recent scans that new scans are correlatively matched
    # against before falling back to the full pose graph. A bigger, denser
    # local window = better local drift correction between global loop
    # closures, at the cost of more CPU per scan.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15    # was 0.2 - match more often -> correct drift sooner
    minimum_travel_heading: 0.15     # was 0.2 (rad)
    scan_buffer_size: 15             # was 10 - larger local "submap" window
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 4.0  # was 3.0 - search further for global (cross-submap) loop closure
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - local ("submap") scan matching
    correlation_search_space_dimension: 0.7   # was 0.5 - wider window so matches
                                               # still succeed if wheel odom has
                                               # drifted further than usual
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - global loop closure across submaps
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
